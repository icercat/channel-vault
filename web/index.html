<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Channel Vault</title><link rel="stylesheet" href="/style.css"><body>
<header><div><span class="eyebrow">YOUR PERSONAL VIDEO ARCHIVE</span><h1>Channel Vault<span>頻道影音庫</span></h1></div><div id="runtime">載入中…</div></header>
<nav><button data-page="channels" class="selected">訂閱頻道</button><button data-page="single">單一連結下載</button><button data-page="all">全部任務</button><button data-page="logs">Log 紀錄</button></nav>
<main><div id="notice" role="status"></div><section id="channels"><div class="section-head"><h2>訂閱頻道</h2><span>自動收錄歷史影片、Shorts 與直播</span></div><form id="subscribe"><input required type="url" id="channel-url" placeholder="https://www.youtube.com/@channel"><button>＋ 追蹤頻道</button></form><div id="channel-list" class="grid"></div></section>
<section id="single" hidden><h2>單一連結下載</h2><p class="muted">貼上 YouTube 影片或 X.com 貼文網址。直播網址會在播放中立即錄製；一則貼文的多個影片會由 yt-dlp 處理。</p><form id="download"><input required type="url" id="link-url" placeholder="https://x.com/user/status/…"><button>加入下載</button></form><div id="single-jobs"></div></section>
<section id="all" hidden><h2>全部下載任務</h2><div id="all-jobs"></div></section>
<section id="detail" hidden><button id="back" class="ghost">← 返回訂閱</button><h2 id="detail-title"></h2><div class="tabs"><button id="videos-tab" class="selected">影片 / Shorts</button><button id="live-tab">直播 / 直播回放</button></div><p class="muted">錄製中會顯示狀態，完成合併後才提供檔案下載。磁碟上的暫存檔會隨直播持續增加。</p><div id="detail-jobs"></div></section>
<section id="logs" hidden><div class="section-head"><h2>Log 紀錄</h2><button id="update" class="ghost">立即檢查 yt-dlp 更新</button></div><div class="log-controls"><label>任務 ID <input id="log-job" type="number" min="1" placeholder="全部"></label><button id="apply-log">篩選</button><span class="muted">自動重新整理 · 顯示最近 300 行</span></div><pre id="log-content"></pre></section>
<div id="paging" hidden><button id="prev" class="ghost">上一頁</button><span id="page-number"></span><button id="next" class="ghost">下一頁</button></div></main><footer>持續追蹤 · 即時錄製 · yt-dlp 自動更新</footer><script src="/app.js"></script></body></html>
