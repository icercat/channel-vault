services:
  channel-vault:
    # 預設拉 GitHub Actions 建好的映像（docker compose pull）；沒有網路或要改程式時仍可 docker compose up -d --build 本機建置
    image: ghcr.io/icercat/channel-vault:latest
    build: .
    container_name: channel-vault
    init: true
    restart: unless-stopped
    expose:
      - "8080"   # 不再直接對外開放,統一經由 gateway(登入頁)進入
    environment:
      TZ: Asia/Taipei
      DATA_DIR: /data
      DOWNLOAD_DIR: /downloads
      LIVE_POLL_SECONDS: ${LIVE_POLL_SECONDS:-30}
      LIVE_SCAN_LIMIT: ${LIVE_SCAN_LIMIT:-10}
      X_SAVE_POSTS: ${X_SAVE_POSTS:-true}
      X_DISCOVERY_MODE: ${X_DISCOVERY_MODE:-cookies}
      TWITTER_POLL_SECONDS: ${TWITTER_POLL_SECONDS:-300}
      SCAN_SECONDS: ${SCAN_SECONDS:-21600}
      UPDATE_SECONDS: ${UPDATE_SECONDS:-86400}
      DOWNLOAD_WORKERS: ${DOWNLOAD_WORKERS:-2}
      LIVE_WORKERS: ${LIVE_WORKERS:-4}
      TRANSCODE_WORKERS: ${TRANSCODE_WORKERS:-1}
      TRANSCODE_THREADS: ${TRANSCODE_THREADS:-2}
      PLAYBACK_HEIGHT: ${PLAYBACK_HEIGHT:-1080}
      YTDLP_CHANNEL: ${YTDLP_CHANNEL:-stable}
      LIVE_FROM_START: ${LIVE_FROM_START:-false}
      WEB_USER: ${WEB_USER:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD in .env first}
    volumes:
      - ./data:/data
      - ./downloads:/downloads
      - ./cookies:/cookies
    stop_grace_period: 60s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  auth:
    image: python:3.12-alpine
    container_name: channel-vault-auth
    restart: unless-stopped
    command: ["python", "-u", "/app/auth.py"]
    environment:
      WEB_USER: ${WEB_USER:-admin}
      WEB_PASSWORD: ${WEB_PASSWORD:?Set WEB_PASSWORD in .env first}
      SESSION_HOURS: ${SESSION_HOURS:-168}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - ./auth/auth.py:/app/auth.py:ro

  gateway:
    image: nginx:alpine
    container_name: channel-vault-gateway
    restart: unless-stopped
    depends_on:
      - channel-vault
      - auth
    ports:
      - "${BIND_IP:-0.0.0.0}:${WEB_PORT:-8088}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
