map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# 前面有 Synology 反向代理(Web Portal)時沿用它帶來的 https,否則用本機 scheme
map $http_x_forwarded_proto $fwd_proto { default $scheme; https https; }

server {
    listen 80;
    client_max_body_size 0;
    # 信任內網/Docker 來源(DSM 反向代理)帶來的真實用戶 IP
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    absolute_redirect off;  # 導向用相對網址,避免帶入容器內部的 80 埠

    # 延遲解析:用 Docker 內建 DNS,在請求時才查容器名稱。
    # 這樣 channel-vault/auth 暫時沒起來時,nginx 不會在啟動時因 "host not found in upstream" 直接退出。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_up    auth;
    set $app_up channel-vault;

    # --- 登入頁 / 登出 (不需驗證) ---
    location = /_login {
        proxy_pass http://$auth_up:8080/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
    }
    location = /_logout { proxy_pass http://$auth_up:8080/logout; }

    # --- 內部驗證子請求 ---
    location = /_check {
        internal;
        proxy_pass http://$auth_up:8080/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # --- 其餘全部需登入,未登入導向登入頁 ---
    location / {
        auth_request /_check;
        error_page 401 = @to_login;

        auth_request_set $upstream_auth $upstream_http_x_upstream_auth;
        proxy_set_header Authorization $upstream_auth;
        proxy_request_buffering off;
        proxy_pass http://$app_up:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location @to_login { return 302 /_login; }
}
